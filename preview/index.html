                <strong>本章目标</strong>

              <h2 id="definition">它是什么</h2>
              <p>基础 Agent 循环是最小可用的 Agent Harness。它负责把用户输入交给模型，判断模型要不要调用工具，把工具结果写回上下文，然后继续让模型生成下一步。</p>
              <pre><code>model -&gt; tool call -&gt; tool result -&gt; updated context -&gt; model -&gt; final answer</code></pre>
              <p>这个例子故意不接真实 LLM API，而是使用 <code>ScriptedModel</code> 模拟一个确定性的模型。这样你可以先专注理解架构，而不是被接入细节打断。</p>

              <h2 id="roles">关键角色</h2>
              <table>
                <thead>
                  <tr>

                    <th>职责</th>
                    <th>为什么重要</th>
                  </tr>
                </thead>

                    <td>保存上下文消息</td>
                    <td>让模型能看到用户输入和工具观察结果。</td>
                  </tr>
                  <tr>
                    <td><code>ToolCall</code></td>
                    <td>表达模型的动作意图</td>
                    <td>把“决策”与“执行”拆开。</td>
                  </tr>
                  <tr>

                    <td>执行具体工具逻辑</td>
                    <td>说明工具只负责动作，不负责流程。</td>
                  </tr>
                  <tr>
                    <td><code>run_agent</code></td>
                    <td>管理循环和停止条件</td>
                    <td>它就是最小 Harness。</td>
                  </tr>
                </tbody>
              </table>

              <h2 id="flow">控制流</h2>

                <section class="doc-card">
                  <h3>模型只做判断</h3>
                  <p>模型不直接执行工具，它只返回结构化意图，比如调用 <code>calculator</code> 并传入表达式。</p>
                </section>
                <section class="doc-card">
                  <h3>Harness 负责执行</h3>
                  <p><code>run_agent</code> 检查工具是否存在、调用工具、记录结果，再把结果写回上下文。</p>
                </section>
                <section class="doc-card">
                  <h3>观察结果驱动下一步</h3>
                  <p>第一次得到 <code>84</code> 之后，模型根据这个观察结果继续请求 <code>84 + 6</code>。</p>
                </section>
                <section class="doc-card">

                <li>Teams already using frameworks but missing the underlying control flow model.</li>
                <li>Developers expanding a single-turn assistant into a task-execution system.</li>
              </ul>
            `
          },
          {
            id: "basic-loop",
            section: "Chapter 01",
            label: "01 - Basic Agent Loop",
            eyebrow: "Chapter 01",
            title: "01 - Basic Agent Loop",
            meta: ["English mirror", "Minimal runnable example", "examples/01-basic-agent-loop"],
            toc: [
              { id: "definition", label: "What it is", level: 2 },
              { id: "roles", label: "Key roles", level: 2 },
              { id: "flow", label: "Control flow", level: 2 },
              { id: "mapping", label: "Production mapping", level: 2 }
            ],
            body: `
              <div class="lead-note">
                <strong>Goal of this chapter</strong>
                Understand why an agent needs a loop and why model responsibilities must stay separate from Harness responsibilities.
              </div>

              <h2 id="definition">What it is</h2>
              <p>The basic agent loop is the smallest useful Agent Harness. It sends user input to the model, checks whether the model wants to call a tool, writes the tool result back into context, and asks the model for the next step.</p>
              <pre><code>model -&gt; tool call -&gt; tool result -&gt; updated context -&gt; model -&gt; final answer</code></pre>
              <p>This example intentionally avoids a real LLM API and uses <code>ScriptedModel</code> as a deterministic stand-in so the architecture is easier to inspect.</p>

              <h2 id="roles">Key roles</h2>
              <table>
                <thead>
                  <tr>
                    <th>Component</th>
                    <th>Responsibility</th>
                    <th>Why it matters</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><code>Message</code></td>
                    <td>Stores context messages</td>
                    <td>Lets the model see both user input and tool observations.</td>
                  </tr>
                  <tr>
                    <td><code>ToolCall</code></td>
                    <td>Represents model action intent</td>
                    <td>Separates decision-making from execution.</td>
                  </tr>
                  <tr>
                    <td><code>calculator</code></td>
                    <td>Executes tool logic</td>
                    <td>Shows that tools own actions, not control flow.</td>
                  </tr>
                  <tr>
                    <td><code>run_agent</code></td>
                    <td>Owns the loop and stop conditions</td>
                    <td>It is the minimal Harness.</td>
                  </tr>
                </tbody>
              </table>

              <h2 id="flow">Control flow</h2>
              <div class="doc-grid">
                <section class="doc-card">
                  <h3>The model only decides</h3>
                  <p>The model does not execute tools directly. It only returns structured intent, such as calling <code>calculator</code> with an expression.</p>
                </section>
                <section class="doc-card">
                  <h3>The Harness executes</h3>
                  <p><code>run_agent</code> checks whether the tool exists, calls it, records the result, and writes that result back into context.</p>
                </section>
                <section class="doc-card">
                  <h3>Observations drive the next step</h3>
                  <p>After the first result is <code>84</code>, the model sees that observation and requests <code>84 + 6</code>.</p>
                </section>
                <section class="doc-card">
                  <h3>The loop must stop</h3>
                  <p>This example uses both <code>FinalAnswer</code> and <code>max_steps</code> to avoid infinite loops.</p>
                </section>
              </div>

              <h3>Run the example</h3>
              <pre><code>python examples/01-basic-agent-loop/basic_agent_loop.py</code></pre>

              <div class="tip-box">
                <strong>What to look for in code</strong>
                Read the code in two passes: first the model layer, then the Harness layer. Do not mistake a tool function for the agent itself.
              </div>

              <h2 id="mapping">Production mapping</h2>
              <p>In a real agent system, <code>ScriptedModel</code> becomes an LLM API, <code>calculator</code> grows into multiple tools, and <code>messages</code> connect to context management and tracing. The core control flow stays the same:</p>
              <ol>
                <li>Prepare context.</li>
                <li>Call the model.</li>
                <li>If the model returns a final answer, stop.</li>
                <li>If the model requests a tool, execute the tool.</li>
                <li>Write the tool result back into context.</li>
                <li>Return to the model and continue.</li>
              </ol>
            `
          }
        ]
      };

      let currentLang = "zh";
      let currentPage = "home";

      const nav = document.getElementById("nav");
      const toc = document.getElementById("toc");
      const title = document.getElementById("article-title");
      const meta = document.getElementById("article-meta");
      const body = document.getElementById("article-body");
      const eyebrow = document.getElementById("article-eyebrow");
      const statusPill = document.getElementById("status-pill");
      const zhButton = document.getElementById("lang-zh");
      const enButton = document.getElementById("lang-en");

      function currentItems() {
        return pages[currentLang];
      }

      function currentPageData() {
        return currentItems().find((item) => item.id === currentPage) || currentItems()[0];
      }

      function renderNav() {
        const groups = [];
        for (const page of currentItems()) {
          let group = groups.find((item) => item.name === page.section);
          if (!group) {
            group = { name: page.section, pages: [] };
            groups.push(group);
          }
          group.pages.push(page);
        }

        nav.innerHTML = groups
          .map(
            (group) => `
              <div class="nav-group">
                <div class="nav-group-title">${group.name}</div>
                ${group.pages
                  .map(
                    (page) => `
                      <a href="#" data-page="${page.id}" class="${page.id === currentPage ? "active" : ""}">
                        ${page.label}
                      </a>
                    `
                  )
                  .join("")}
              </div>
            `
          )
          .join("");

        for (const link of nav.querySelectorAll("[data-page]")) {
          link.addEventListener("click", function (event) {
            event.preventDefault();
            currentPage = link.getAttribute("data-page");
            render();
            window.scrollTo({ top: 0 });
          });
        }
      }

      function renderMeta(chips) {
        meta.innerHTML = chips
          .map((item) => `<span class="meta-chip">${item}</span>`)
          .join("");
      }

      function renderToc(items) {
        toc.innerHTML = items
          .map(
            (item) => `
              <a href="#${item.id}" class="toc-level-${item.level}">${item.label}</a>
            `
          )
          .join("");
      }

      function bindTocState() {
        const links = Array.from(toc.querySelectorAll("a"));
        if (!links.length) {
          return;
        }

        const sections = links
          .map((link) => {
            const id = link.getAttribute("href").slice(1);
            return { link, section: document.getElementById(id) };
          })
          .filter((item) => item.section);

        function updateActive() {
          let active = sections[0];
          for (const item of sections) {
            if (item.section.getBoundingClientRect().top <= 110) {
              active = item;
            }
          }
          for (const item of sections) {
            item.link.classList.toggle("active", item === active);
          }
        }

        window.addEventListener("scroll", updateActive, { passive: true });
        updateActive();
      }

      function renderArticle() {
        const page = currentPageData();
        title.textContent = page.title;
        eyebrow.textContent = page.eyebrow;
        statusPill.textContent = currentLang === "zh" ? "中文主内容" : "English mirror";
        renderMeta(page.meta);
        body.innerHTML = page.body;
        renderToc(page.toc);
        bindTocState();
      }

      function render() {
        zhButton.classList.toggle("active", currentLang === "zh");
        enButton.classList.toggle("active", currentLang === "en");
        renderNav();
        renderArticle();
      }

      zhButton.addEventListener("click", function () {
        currentLang = "zh";
        currentPage = "home";
        render();
        window.scrollTo({ top: 0 });
      });

      enButton.addEventListener("click", function () {
        currentLang = "en";
        currentPage = "home";
        render();
        window.scrollTo({ top: 0 });
      });

      render();
    </script>
  </body>
</html>
