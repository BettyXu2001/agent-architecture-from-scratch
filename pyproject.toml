[project]
name = "agent-architecture-from-scratch"
version = "0.1.0"
description = "Learn modern AI agent architectures from scratch with runnable examples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Agent Architecture from Scratch Contributors" }
]
keywords = [
  "ai-agent",
  "agent-architecture",
  "llm",
  "tool-calling",
  "react-agent",
  "multi-agent",
  "from-scratch"
]
dependencies = []

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"
